[project]
name = "umami-mcp-server"
version = "0.3.0"
description = "MCP server exposing Umami analytics (Cloud + self-hosted)"
readme = "README.md"
authors = [
    { name = "Alessandro Ferrini", email = "im@alessandroferrini.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.0.0,<3",
    "opentelemetry-api>=1.44.0,<2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-distro>=0.65b0,<1",
    "opentelemetry-exporter-otlp>=1.44.0,<2",
    "opentelemetry-sdk>=1.44.0,<2",
]

[dependency-groups]
dev = [
    "opentelemetry-sdk>=1.44.0,<2",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: optional tests against a real Umami Cloud account",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[project.scripts]
umami-mcp-server = "umami_mcp_server:main"

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"
