name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --dev
      - run: uv run ruff format . --check
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv build --no-sources
      - run: uv venv --python 3.11 .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python dist/*.whl
      - name: Check installed wheel metadata
        run: |
          .wheel-venv/bin/python - <<'PY'
          from importlib.metadata import requires, version
          import umami_mcp_server

          assert version("umami-mcp-server") == "0.2.0"
          dependencies = requires("umami-mcp-server") or []
          assert any(item.lower().startswith("tzdata") for item in dependencies)
          assert callable(umami_mcp_server.main)
          PY
      - name: Smoke test entry point
        run: UMAMI_API_KEY=wheel-smoke timeout 5s .wheel-venv/bin/umami-mcp-server </dev/null
