name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --dev
      - run: uv run ruff format . --check
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
      - run: uv build --no-sources
      - run: uv venv --python 3.11 .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python dist/*.whl
      - name: Check base wheel metadata and imports
        run: |
          .wheel-venv/bin/python - <<'PY'
          import asyncio
          import importlib.util
          import tomllib
          from importlib.metadata import requires, version

          import httpx
          import umami_mcp_server
          import umami_mcp_server.server
          from umami_mcp_server.settings import Settings
          from umami_mcp_server.umami_client import UmamiClient

          with open("pyproject.toml", "rb") as file:
              project_version = tomllib.load(file)["project"]["version"]
          assert version("umami-mcp-server") == project_version
          dependencies = requires("umami-mcp-server") or []
          assert any(item.lower().startswith("opentelemetry-api") for item in dependencies)
          assert any(item.lower().startswith("tzdata") for item in dependencies)
          assert importlib.util.find_spec("opentelemetry.sdk") is None
          assert callable(umami_mcp_server.main)

          original_async_client = httpx.AsyncClient
          transport = httpx.MockTransport(
              lambda _: httpx.Response(
                  200,
                  json={"data": [], "count": 0, "page": 1, "pageSize": 10},
              )
          )

          def client_factory(*args, **kwargs):
              return original_async_client(*args, **kwargs, transport=transport)

          httpx.AsyncClient = client_factory

          async def request():
              client = UmamiClient(Settings(umami_api_key="wheel-smoke"))
              try:
                  await client.get_websites()
              finally:
                  await client.aclose()

          asyncio.run(request())
          PY
      - name: Smoke test base entry point
        run: UMAMI_API_KEY=wheel-smoke timeout 5s .wheel-venv/bin/umami-mcp-server </dev/null
      - name: Check wheel with observability extra
        run: |
          uv venv --python 3.11 .wheel-otel-venv
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          uv pip install --python .wheel-otel-venv/bin/python "${wheel}[otel]"
          .wheel-otel-venv/bin/python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("opentelemetry.sdk") is not None
          assert importlib.util.find_spec("opentelemetry.distro") is not None
          assert importlib.util.find_spec("opentelemetry.exporter.otlp") is not None
          PY
          UMAMI_API_KEY=wheel-smoke OTEL_SDK_DISABLED=true timeout 5s \
            .wheel-otel-venv/bin/opentelemetry-instrument \
            .wheel-otel-venv/bin/umami-mcp-server </dev/null
