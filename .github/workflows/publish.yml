name: Publish to PyPI
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
      - name: Verify tag matches project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as file:
              project_version = tomllib.load(file)["project"]["version"]
          assert os.environ["RELEASE_TAG"] == project_version, (
              f"tag {os.environ['RELEASE_TAG']} does not match {project_version}"
          )
          PY
      - name: Build fresh artifacts
        run: |
          rm -rf dist
          uv build --no-sources
      - run: uv publish dist/*
